name: Kaggle Executor - T4 GPU Fix (Thread Safe)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cron-trigger]

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install kaggle
    
    - name: Execute notebooks
      run: |
        python << 'PYEOF'
        import os
        import subprocess
        import json
        import sys
        import re
        from datetime import datetime
        import shutil
        import time
        from concurrent.futures import ThreadPoolExecutor, as_completed

        # ========================================
        # CONFIGURATION
        # ========================================
        FIREBASE_DATASET_REF = "shreevathsbbhh/firebase-credentials"

        WEEKLY_SCHEDULE = {
            "Friday": [
                {"username": "shreevathsaz", "key": "2faa3199cb4f8a0d88a8999604ac6770"},
                {"username": "shreevathsamm", "key": "613f3e396b629b0df65e65e35fe7b243"}
            ],
            "Saturday": [
                {"username": "vathsam", "key": "f50456cea220739ad0ecb651e79593bd"},
                {"username": "svproeditor", "key": "e423020355bbdd8a2a8b410587cec0cd"}
            ],
            "Sunday": [
                {"username": "yamanya", "key": "6a8da12facf5fbcc820cd00baa788a99"},
                {"username": "yamunappacom", "key": "d34212355d722ee3c75b8b6e06e2ce87"}
            ],
            "Monday": [
                {"username": "vaishakha98", "key": "4240e8c91b5cd8537de55bad47554b5e"},
                {"username": "riocom", "key": "79898aeec842d5ef19dd7acbd0c7f356"}
            ],
            "Tuesday": [
                {"username": "leommmmm", "key": "c88472f292e5de46c97952906d79c896"}
            ],
            "Wednesday": [],
            "Thursday": []
        }

        # ========================================
        # HELPER FUNCTIONS
        # ========================================
        def log(msg, symbol="ℹ️"):
            timestamp = datetime.utcnow().strftime('%H:%M:%S')
            print(f"[{timestamp}] {symbol} {msg}")
            sys.stdout.flush()

        # UPDATED: Now accepts 'env' dictionary to handle auth safely
        def run_cmd(cmd, timeout=180, cwd=None, env=None):
            try:
                # If no specific env provided, use current system env
                run_env = env if env else os.environ.copy()
                
                result = subprocess.run(
                    cmd, 
                    shell=True, 
                    stdout=subprocess.PIPE, 
                    stderr=subprocess.PIPE, 
                    text=True, 
                    timeout=timeout, 
                    cwd=cwd,
                    env=run_env  # Pass the isolated credentials here
                )
                return result.returncode == 0, result.stdout, result.stderr
            except subprocess.TimeoutExpired:
                return False, "", "Timeout"
            except Exception as e:
                return False, "", str(e)

        def inject_server_id_raw(notebook_path, server_id):
            try:
                with open(notebook_path, 'r', encoding='utf-8') as f:
                    content = f.read()
                
                pattern = r'(SERVER_ID\s*=\s*\\?["\']).*?(\\?["\'])'
                replacement = f'\\g<1>{server_id}\\g<2>'
                
                new_content, count = re.subn(pattern, replacement, content)
                
                if count > 0:
                    with open(notebook_path, 'w', encoding='utf-8') as f:
                        f.write(new_content)
                    return True, f"Replaced {count} occurrence(s)"
                else:
                    return False, "Pattern not found"
                    
            except Exception as e:
                return False, str(e)

        def inject_t4_metadata(notebook_path):
            try:
                with open(notebook_path, 'r', encoding='utf-8') as f:
                    data = json.load(f)
                
                if 'metadata' not in data: data['metadata'] = {}
                if 'kaggle' not in data['metadata']: data['metadata']['kaggle'] = {}
                
                # FORCE T4 SETTINGS
                data['metadata']['kaggle']['accelerator'] = 'nvidiaTeslaT4'
                data['metadata']['kaggle']['isGpuEnabled'] = True
                
                with open(notebook_path, 'w', encoding='utf-8') as f:
                    json.dump(data, f, indent=2)
                
                return True, "T4 Metadata Injected"
            except Exception as e:
                return False, str(e)

        def execute_notebook(account, notebook_name, dest_slug, server_id):
            log(f"START: {notebook_name} → {account['username']}", "🚀")
            
            base_dir = os.getcwd()
            work_dir = os.path.join(base_dir, f"work_{notebook_name}_{account['username']}")
            
            # PREPARE AUTH ENVIRONMENT VARIABLES
            # This ensures this specific thread uses ONLY these credentials
            auth_env = os.environ.copy()
            auth_env["KAGGLE_USERNAME"] = account["username"]
            auth_env["KAGGLE_KEY"] = account["key"]
            
            try:
                # 1. DELETE EXISTING KERNEL (Using Env Vars)
                log(f"Resetting kernel {dest_slug}...", "♻️")
                # We ignore errors (like 404 not found) for delete
                run_cmd(f"kaggle kernels delete {dest_slug} -y", timeout=60, env=auth_env)
                time.sleep(5) # Wait for deletion to propagate
                
                # 2. Prepare Directory
                if os.path.exists(work_dir):
                    shutil.rmtree(work_dir)
                os.makedirs(work_dir)
                
                base_notebook_path = os.path.join(base_dir, "gpuss.ipynb")
                work_notebook_path = os.path.join(work_dir, f"{notebook_name}.ipynb")
                
                if not os.path.exists(base_notebook_path):
                    return False
                    
                shutil.copy(base_notebook_path, work_notebook_path)
                
                # 3. Inject Server ID
                inject_server_id_raw(work_notebook_path, server_id)

                # 4. Inject T4 Metadata
                t4_success, t4_msg = inject_t4_metadata(work_notebook_path)
                if t4_success:
                    log(f"✓ {t4_msg}", "⚡")
                
                # 5. Create Metadata
                metadata = {
                    "id": dest_slug,
                    "title": notebook_name,
                    "code_file": f"{notebook_name}.ipynb",
                    "language": "python",
                    "kernel_type": "notebook",
                    "is_private": True,
                    "enable_gpu": True,
                    "enable_internet": True,
                    "enable_tpu": False,
                    "dataset_sources": [FIREBASE_DATASET_REF]
                }
                
                with open(os.path.join(work_dir, "kernel-metadata.json"), 'w', encoding='utf-8') as f:
                    json.dump(metadata, f, indent=2)
                
                # 6. Push (Using Env Vars)
                log("Pushing new T4 kernel...", "📤")
                success, stdout, stderr = run_cmd("kaggle kernels push", timeout=240, cwd=work_dir, env=auth_env)
                
                if not success:
                    log(f"PUSH FAILED: {stderr.strip()}", "❌")
                    return False
                
                log(f"Push OK: https://www.kaggle.com/code/{dest_slug}", "✅")
                return True
                
            except Exception as e:
                log(f"EXCEPTION: {str(e)}", "❌")
                return False
            finally:
                if os.path.exists(work_dir):
                    try: shutil.rmtree(work_dir)
                    except: pass

        def execute_notebook_wrapper(args):
            account, notebook_name, dest_slug, server_id, start_delay = args
            if start_delay > 0: time.sleep(start_delay)
            result_key = f"{account['username']}/{notebook_name}"
            success = execute_notebook(account, notebook_name, dest_slug, server_id)
            return (result_key, success)
        
        def execute_all():
            current_day = datetime.utcnow().strftime('%A')
            log(f"KAGGLE EXECUTOR - T4 GPU FIX (THREAD SAFE)", "🚀")
            
            if current_day not in WEEKLY_SCHEDULE:
                sys.exit(1)
            
            accounts_today = WEEKLY_SCHEDULE[current_day]
            if not accounts_today:
                sys.exit(0)
            
            tasks = []
            global_counter = 1 
            task_delay_counter = 0

            for account in accounts_today:
                for _ in range(2):
                    notebook_filename = f"server-{global_counter}" 
                    server_var_id = f"server_{global_counter}"     
                    dest_slug = f"{account['username']}/{notebook_filename}"
                    delay = task_delay_counter * 3
                    tasks.append((account, notebook_filename, dest_slug, server_var_id, delay))
                    global_counter += 1
                    task_delay_counter += 1
            
            results = {}
            with ThreadPoolExecutor(max_workers=len(tasks)) as executor:
                future_to_task = {executor.submit(execute_notebook_wrapper, task): task for task in tasks}
                for future in as_completed(future_to_task):
                    key, success = future.result()
                    results[key] = success
                    print(f"Result: {key} -> {'✅ Success' if success else '❌ Failed'}")

            if sum(results.values()) < len(tasks):
                sys.exit(1)

        execute_all()
        PYEOF
