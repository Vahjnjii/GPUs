name: Kaggle Notebook Executor - Firebase Edition

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cron-trigger]

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install kaggle
    
    - name: Execute notebooks
      run: |
        python << 'PYEOF'
        import os
        import subprocess
        import json
        import sys
        from datetime import datetime
        import shutil
        import time

        # ========================================
        # FIREBASE CONFIGURATION
        # ========================================
        # Public Firebase credentials dataset (accessible to all accounts)
        FIREBASE_DATASET_REF = "shreevathsbbhh/firebase-credentials"

        # ========================================
        # WEEKLY SCHEDULE
        # ========================================
        WEEKLY_SCHEDULE = {
            "Friday": [
                {"username": "shreevathsaz", "key": "2faa3199cb4f8a0d88a8999604ac6770"},
                {"username": "shreevathsamm", "key": "613f3e396b629b0df65e65e35fe7b243"}
            ],
            "Saturday": [
                {"username": "vathsam", "key": "f50456cea220739ad0ecb651e79593bd"},
                {"username": "svproeditor", "key": "e423020355bbdd8a2a8b410587cec0cd"}
            ],
            "Sunday": [
                {"username": "yamanya", "key": "6a8da12facf5fbcc820cd00baa788a99"},
                {"username": "yamunappacom", "key": "d34212355d722ee3c75b8b6e06e2ce87"}
            ],
            "Monday": [
                {"username": "vaishakha98", "key": "4240e8c91b5cd8537de55bad47554b5e"},
                {"username": "riocom", "key": "79898aeec842d5ef19dd7acbd0c7f356"}
            ],
            "Tuesday": [
                {"username": "leommmmm", "key": "c88472f292e5de46c97952906d79c896"}
                # Account 10: PENDING - Add when available
            ],
            "Wednesday": [
                # Account 11: PENDING
                # Account 12: PENDING
            ],
            "Thursday": [
                # Account 13: PENDING
                # Account 14: PENDING
            ]
        }

        # ========================================
        # HELPER FUNCTIONS
        # ========================================
        def log(msg, symbol="ℹ️"):
            timestamp = datetime.utcnow().strftime('%H:%M:%S')
            print(f"[{timestamp}] {symbol} {msg}")
            sys.stdout.flush()

        def setup_kaggle_auth(account):
            kaggle_dir = os.path.join(os.path.expanduser("~"), ".kaggle")
            os.makedirs(kaggle_dir, exist_ok=True)
            kaggle_json = os.path.join(kaggle_dir, "kaggle.json")
            with open(kaggle_json, 'w') as f:
                json.dump({"username": account["username"], "key": account["key"]}, f)
            os.chmod(kaggle_json, 0o600)
            log(f"Auth set: {account['username']}", "🔑")

        def run_cmd(cmd, timeout=180, cwd=None):
            try:
                result = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=timeout, cwd=cwd)
                return result.returncode == 0, result.stdout, result.stderr
            except subprocess.TimeoutExpired:
                return False, "", "Timeout"
            except Exception as e:
                return False, "", str(e)

        def inject_server_id(notebook_path, server_id):
            """
            Inject SERVER_ID into the notebook using text-based replacement.
            Replaces: SERVER_ID = "server_1" with appropriate server number
            """
            with open(notebook_path, 'r', encoding='utf-8') as f:
                notebook_text = f.read()
            
            # Replace SERVER_ID value (handles JSON escaping automatically)
            notebook_text = notebook_text.replace(
                'SERVER_ID = "server_1"',
                f'SERVER_ID = "{server_id}"'
            )
            
            with open(notebook_path, 'w', encoding='utf-8') as f:
                f.write(notebook_text)
            
            return True

        def get_dataset_id(dataset_ref):
            """
            Retrieve the numeric dataset ID from Kaggle API.
            Format: username/dataset-name → numeric ID
            """
            try:
                # Use kaggle API to get dataset info
                cmd = f'kaggle datasets status {dataset_ref}'
                success, stdout, stderr = run_cmd(cmd, timeout=30)
                
                if success and stdout:
                    # Parse dataset info - this is a simplified approach
                    # In production, you might want to use kaggle API directly
                    log(f"Dataset found: {dataset_ref}", "✅")
                    # Return a placeholder - Kaggle will resolve by ref
                    return dataset_ref
                else:
                    log(f"Warning: Could not verify dataset {dataset_ref}", "⚠️")
                    return dataset_ref
            except Exception as e:
                log(f"Dataset check error: {e}", "⚠️")
                return dataset_ref

        def execute_notebook(account, notebook_name, dest_slug, server_id):
            log(f"START: {notebook_name} → {account['username']}", "🚀")
            log(f"  Server ID: {server_id}", "🔧")
            log(f"  Dataset: {FIREBASE_DATASET_REF}", "🔥")
            
            # Use absolute paths for thread safety
            base_dir = os.getcwd()
            work_dir = os.path.join(base_dir, f"work_{notebook_name}_{account['username']}")
            
            try:
                # Clean directory
                if os.path.exists(work_dir):
                    shutil.rmtree(work_dir)
                os.makedirs(work_dir)
                
                # STEP 1: Copy base notebook from repo
                log(f"Loading base notebook template...", "📂")
                base_notebook_path = os.path.join(base_dir, "gpuss.ipynb")
                
                if not os.path.exists(base_notebook_path):
                    log(f"ERROR: gpuss.ipynb not found in repository!", "❌")
                    return False
                
                work_notebook_path = os.path.join(work_dir, f"{notebook_name}.ipynb")
                shutil.copy(base_notebook_path, work_notebook_path)
                
                # STEP 2: Inject SERVER_ID
                log(f"Injecting SERVER_ID: {server_id}...", "💉")
                inject_server_id(work_notebook_path, server_id)
                
                # Verify injection
                with open(work_notebook_path, 'r', encoding='utf-8') as f:
                    content = f.read()
                    if f'SERVER_ID = "{server_id}"' in content:
                        log(f"✓ Verified: {server_id} injected successfully", "🔍")
                    else:
                        log(f"⚠️ Warning: {server_id} not found in notebook!", "⚠️")
                
                # STEP 3: Create metadata with Firebase dataset
                log(f"Creating metadata with Firebase dataset...", "📝")
                metadata = {
                    "id": dest_slug,
                    "title": notebook_name,
                    "code_file": f"{notebook_name}.ipynb",
                    "language": "python",
                    "kernel_type": "notebook",
                    "is_private": True,
                    "enable_gpu": True,
                    "enable_internet": True,
                    "enable_tpu": False,
                    "dataset_sources": [FIREBASE_DATASET_REF],  # Firebase credentials dataset
                    "kernel_sources": [],
                    "competition_sources": []
                }
                
                # Save metadata
                metadata_path = os.path.join(work_dir, "kernel-metadata.json")
                with open(metadata_path, 'w', encoding='utf-8') as f:
                    json.dump(metadata, f, indent=2)
                
                log(f"Metadata created: id={metadata['id']}", "📋")
                log(f"  Dataset attached: {FIREBASE_DATASET_REF}", "📎")
                
                # STEP 4: Push to Kaggle
                setup_kaggle_auth(account)
                time.sleep(0.3)
                
                # List directory contents
                dir_contents = [f for f in os.listdir(work_dir)]
                log(f"Directory contents: {dir_contents}", "📂")
                
                log(f"Pushing to Kaggle...", "📤")
                success, stdout, stderr = run_cmd("kaggle kernels push", timeout=240, cwd=work_dir)
                
                if not success:
                    log(f"PUSH FAILED", "❌")
                    log(f"Stderr: {stderr[:500]}", "")
                    log(f"Stdout: {stdout[:500]}", "")
                    return False
                
                log(f"Push OK: {notebook_name}", "✅")
                log(f"URL: https://www.kaggle.com/code/{dest_slug}", "🔗")
                return True
                
            except Exception as e:
                log(f"EXCEPTION: {str(e)}", "❌")
                import traceback
                traceback.print_exc()
                return False
                
            finally:
                # Cleanup
                if os.path.exists(work_dir):
                    try:
                        shutil.rmtree(work_dir)
                    except:
                        pass

        # ========================================
        # PARALLEL EXECUTION WORKER
        # ========================================
        from concurrent.futures import ThreadPoolExecutor, as_completed
        import threading
        
        results_lock = threading.Lock()
        
        def execute_notebook_wrapper(args):
            """Wrapper for parallel execution with stagger delay"""
            account, notebook_name, dest_slug, server_id, start_delay = args
            
            # Stagger the start to avoid Kaggle API rate limiting
            if start_delay > 0:
                time.sleep(start_delay)
            
            result_key = f"{account['username']}/{notebook_name}"
            success = execute_notebook(account, notebook_name, dest_slug, server_id)
            return (result_key, success)
        
        # ========================================
        # MAIN EXECUTION
        # ========================================
        def execute_all():
            start = datetime.utcnow()
            
            # Detect current day
            current_day = datetime.utcnow().strftime('%A')
            
            log("═" * 70, "")
            log(f"KAGGLE NOTEBOOK EXECUTOR - FIREBASE EDITION", "🚀")
            log("═" * 70, "")
            log(f"Current Day: {current_day}", "📅")
            log(f"Execution Time: {start.isoformat()}", "🕐")
            log(f"Firebase Dataset: {FIREBASE_DATASET_REF}", "🔥")
            
            # Check if day has configuration
            if current_day not in WEEKLY_SCHEDULE:
                log(f"ERROR: {current_day} not in schedule!", "❌")
                sys.exit(1)
            
            accounts_today = WEEKLY_SCHEDULE[current_day]
            
            # Check if day has accounts
            if not accounts_today:
                log(f"⚠️ No accounts configured for {current_day}. Skipping execution.", "⏭️")
                log("Please add account credentials for this day in the workflow configuration.", "")
                sys.exit(0)
            
            log(f"Accounts scheduled: {len(accounts_today)}", "👥")
            log(f"Total notebooks to execute: {len(accounts_today) * 2}", "📊")
            log(f"Mode: ALWAYS CREATE (Fresh notebooks every time)", "⚡")
            log(f"Credential System: Firebase (from dataset)", "🔐")
            log(f"Stagger: 2s interval to avoid API limits", "⏱️")
            log("═" * 70, "")
            
            # Prepare all tasks
            tasks = []
            task_index = 0
            global_server_id = 1  # Sequential SERVER_ID across ALL notebooks
            
            for account_idx, account in enumerate(accounts_today):
                log(f"📋 Preparing tasks for: {account['username']}", "")
                
                for notebook_name in ["server-1", "server-2"]:
                    dest_slug = f"{account['username']}/{notebook_name}"
                    server_id = f"server_{global_server_id}"  # Sequential: server_1, server_2, server_3, server_4...
                    
                    # Calculate stagger delay: 2 seconds between each task
                    start_delay = task_index * 2
                    
                    log(f"  • {notebook_name} → {server_id} (start +{start_delay}s)", "")
                    
                    tasks.append((account, notebook_name, dest_slug, server_id, start_delay))
                    task_index += 1
                    global_server_id += 1  # Increment for next notebook
            
            log("", "")
            log(f"🚀 Starting execution ({len(tasks)} notebooks, 2s stagger)...", "")
            log("═" * 70, "")
            
            results = {}
            
            # Execute all notebooks in parallel (with stagger)
            with ThreadPoolExecutor(max_workers=len(tasks)) as executor:
                future_to_task = {executor.submit(execute_notebook_wrapper, task): task for task in tasks}
                
                for future in as_completed(future_to_task):
                    result_key, success = future.result()
                    results[result_key] = success
                    
                    status = "✅" if success else "❌"
                    log(f"{status} Completed: {result_key}", "")
            
            # Summary
            success_count = sum(results.values())
            duration = (datetime.utcnow() - start).total_seconds()
            
            log("", "")
            log("═" * 70, "")
            log(f"EXECUTION SUMMARY", "🏁")
            log("═" * 70, "")
            log(f"Day: {current_day}", "📅")
            log(f"Total Time: {duration:.1f}s ({duration/60:.1f} min)", "⏱️")
            log(f"Success: {success_count}/{len(results)}", "📊")
            log(f"Firebase Dataset: {FIREBASE_DATASET_REF}", "🔥")
            log("", "")
            
            for nb_name, success in sorted(results.items()):
                status = "✅" if success else "❌"
                log(f"{status} {nb_name}", "")
            
            log("═" * 70, "")
            
            if success_count < len(results):
                log(f"⚠️ {len(results) - success_count} notebook(s) failed", "")
                sys.exit(1)
            else:
                log("🎉 All notebooks executed successfully!", "")
                log("", "")
                log("🔍 VERIFICATION: Check notebooks on Kaggle:", "")
                for nb_name in sorted(results.keys()):
                    log(f"   https://www.kaggle.com/code/{nb_name}", "🔗")
                log("", "")
                log("💡 Each notebook will auto-load Firebase credentials from the dataset!", "")

        execute_all()
        PYEOF
