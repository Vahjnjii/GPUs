name: Kaggle Notebook Executor - Fixed Injection

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cron-trigger]

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install kaggle
    
    - name: Execute notebooks
      run: |
        python << 'PYEOF'
        import os
        import subprocess
        import json
        import sys
        import re
        from datetime import datetime
        import shutil
        import time
        from concurrent.futures import ThreadPoolExecutor, as_completed

        # ========================================
        # FIREBASE CONFIGURATION
        # ========================================
        FIREBASE_DATASET_REF = "shreevathsbbhh/firebase-credentials"

        # ========================================
        # WEEKLY SCHEDULE
        # ========================================
        WEEKLY_SCHEDULE = {
            "Friday": [
                {"username": "shreevathsaz", "key": "2faa3199cb4f8a0d88a8999604ac6770"},
                {"username": "shreevathsamm", "key": "613f3e396b629b0df65e65e35fe7b243"}
            ],
            "Saturday": [
                {"username": "vathsam", "key": "f50456cea220739ad0ecb651e79593bd"},
                {"username": "svproeditor", "key": "e423020355bbdd8a2a8b410587cec0cd"}
            ],
            "Sunday": [
                {"username": "yamanya", "key": "6a8da12facf5fbcc820cd00baa788a99"},
                {"username": "yamunappacom", "key": "d34212355d722ee3c75b8b6e06e2ce87"}
            ],
            "Monday": [
                {"username": "vaishakha98", "key": "4240e8c91b5cd8537de55bad47554b5e"},
                {"username": "riocom", "key": "79898aeec842d5ef19dd7acbd0c7f356"}
            ],
            "Tuesday": [
                {"username": "leommmmm", "key": "c88472f292e5de46c97952906d79c896"}
            ],
            "Wednesday": [],
            "Thursday": []
        }

        # ========================================
        # HELPER FUNCTIONS
        # ========================================
        def log(msg, symbol="ℹ️"):
            timestamp = datetime.utcnow().strftime('%H:%M:%S')
            print(f"[{timestamp}] {symbol} {msg}")
            sys.stdout.flush()

        def setup_kaggle_auth(account):
            kaggle_dir = os.path.join(os.path.expanduser("~"), ".kaggle")
            os.makedirs(kaggle_dir, exist_ok=True)
            kaggle_json = os.path.join(kaggle_dir, "kaggle.json")
            with open(kaggle_json, 'w') as f:
                json.dump({"username": account["username"], "key": account["key"]}, f)
            os.chmod(kaggle_json, 0o600)
            log(f"Auth set: {account['username']}", "🔑")

        def run_cmd(cmd, timeout=180, cwd=None):
            try:
                result = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=timeout, cwd=cwd)
                return result.returncode == 0, result.stdout, result.stderr
            except subprocess.TimeoutExpired:
                return False, "", "Timeout"
            except Exception as e:
                return False, "", str(e)

        def inject_server_id_smart(notebook_path, server_id):
            """
            Robust Injection:
            1. Parses notebook as JSON.
            2. Looks for 'SERVER_ID =' line in code cells.
            3. If found -> Replaces it.
            4. If NOT found -> Creates a NEW cell at the top.
            """
            try:
                with open(notebook_path, 'r', encoding='utf-8') as f:
                    nb = json.load(f)
                
                found = False
                new_line = f'SERVER_ID = "{server_id}"\n'
                
                # Check existing cells
                if 'cells' in nb:
                    for cell in nb['cells']:
                        if cell['cell_type'] == 'code':
                            new_source = []
                            for line in cell['source']:
                                # Flexible match for SERVER_ID = ...
                                if 'SERVER_ID' in line and '=' in line:
                                    new_source.append(new_line)
                                    found = True
                                else:
                                    new_source.append(line)
                            cell['source'] = new_source
                            if found: break
                
                # If variable wasn't found, INSERT it at the top
                if not found:
                    log(f"⚠️ SERVER_ID not found in code. Auto-inserting new cell...", "➕")
                    new_cell = {
                        "cell_type": "code",
                        "execution_count": None,
                        "metadata": {},
                        "outputs": [],
                        "source": [
                            "# Auto-generated Server ID configuration\n",
                            new_line
                        ]
                    }
                    if 'cells' not in nb: nb['cells'] = []
                    nb['cells'].insert(0, new_cell)
                    
                with open(notebook_path, 'w', encoding='utf-8') as f:
                    json.dump(nb, f, indent=1)
                    
                return True
            except Exception as e:
                log(f"Injection Error: {e}", "❌")
                return False

        def execute_notebook(account, notebook_name, dest_slug, server_id):
            log(f"START: {notebook_name} → {account['username']}", "🚀")
            
            # Use absolute paths for thread safety
            base_dir = os.getcwd()
            work_dir = os.path.join(base_dir, f"work_{notebook_name}_{account['username']}")
            
            try:
                # Clean directory
                if os.path.exists(work_dir):
                    shutil.rmtree(work_dir)
                os.makedirs(work_dir)
                
                # STEP 1: Copy base notebook
                base_notebook_path = os.path.join(base_dir, "gpuss.ipynb")
                
                if not os.path.exists(base_notebook_path):
                    log(f"ERROR: gpuss.ipynb not found!", "❌")
                    return False
                
                work_notebook_path = os.path.join(work_dir, f"{notebook_name}.ipynb")
                shutil.copy(base_notebook_path, work_notebook_path)
                
                # STEP 2: Inject SERVER_ID (Smart JSON Mode)
                if inject_server_id_smart(work_notebook_path, server_id):
                    log(f"✓ Injected: {server_id}", "💉")
                else:
                    log(f"❌ Critical: Failed to inject {server_id}", "❌")
                    return False
                
                # STEP 3: Create Metadata
                # Format Title nicely: "Server 01"
                try:
                    num_part = server_id.split('_')[-1]
                    formatted_title = f"Server {int(num_part):02d}"
                except:
                    formatted_title = server_id.replace('_', ' ').title()

                metadata = {
                    "id": dest_slug,
                    "title": formatted_title,
                    "code_file": f"{notebook_name}.ipynb",
                    "language": "python",
                    "kernel_type": "notebook",
                    "is_private": True,
                    "enable_gpu": True,
                    "enable_internet": True,
                    "enable_tpu": False,
                    "dataset_sources": [FIREBASE_DATASET_REF],
                    "kernel_sources": [],
                    "competition_sources": []
                }
                
                # Save metadata
                metadata_path = os.path.join(work_dir, "kernel-metadata.json")
                with open(metadata_path, 'w', encoding='utf-8') as f:
                    json.dump(metadata, f, indent=2)
                
                # STEP 4: Push to Kaggle
                setup_kaggle_auth(account)
                
                # Push
                success, stdout, stderr = run_cmd("kaggle kernels push", timeout=240, cwd=work_dir)
                
                if not success:
                    log(f"PUSH FAILED: {stderr[:200]}", "❌")
                    return False
                
                log(f"Push OK: https://www.kaggle.com/code/{dest_slug}", "✅")
                return True
                
            except Exception as e:
                log(f"EXCEPTION: {str(e)}", "❌")
                return False
            finally:
                if os.path.exists(work_dir):
                    try: shutil.rmtree(work_dir)
                    except: pass

        # ========================================
        # WORKER WRAPPER
        # ========================================
        def execute_notebook_wrapper(args):
            account, notebook_name, dest_slug, server_id, start_delay = args
            if start_delay > 0:
                time.sleep(start_delay)
            result_key = f"{account['username']}/{notebook_name}"
            success = execute_notebook(account, notebook_name, dest_slug, server_id)
            return (result_key, success)
        
        # ========================================
        # MAIN EXECUTION
        # ========================================
        def execute_all():
            start = datetime.utcnow()
            current_day = datetime.utcnow().strftime('%A')
            
            log("═" * 70, "")
            log(f"KAGGLE NOTEBOOK EXECUTOR - SMART INJECTION", "🚀")
            log("═" * 70, "")
            
            if current_day not in WEEKLY_SCHEDULE:
                log(f"Error: Day {current_day} not found in schedule.", "❌")
                sys.exit(1)
            
            accounts_today = WEEKLY_SCHEDULE[current_day]
            
            if not accounts_today:
                log(f"No accounts for {current_day}. Exiting.", "⏭️")
                sys.exit(0)
            
            log(f"Target: {len(accounts_today)} accounts", "👥")
            log("Mode: Sequential IDs + Smart Injection", "🔧")
            log("═" * 70, "")
            
            tasks = []
            
            # GLOBAL COUNTER: Server 1, Server 2...
            global_counter = 1 
            task_delay_counter = 0

            for account in accounts_today:
                # Each account gets 2 notebooks
                for _ in range(2):
                    notebook_filename = f"server-{global_counter}" # server-1
                    server_var_id = f"server_{global_counter}"     # server_1
                    dest_slug = f"{account['username']}/{notebook_filename}"
                    
                    delay = task_delay_counter * 3
                    
                    log(f"📋 Queuing: {dest_slug} (ID: {server_var_id})", "Pending")
                    
                    tasks.append((account, notebook_filename, dest_slug, server_var_id, delay))
                    
                    global_counter += 1
                    task_delay_counter += 1
            
            log("", "")
            log(f"🚀 Launching {len(tasks)} notebooks...", "")
            log("═" * 70, "")
            
            results = {}
            with ThreadPoolExecutor(max_workers=len(tasks)) as executor:
                future_to_task = {executor.submit(execute_notebook_wrapper, task): task for task in tasks}
                for future in as_completed(future_to_task):
                    key, success = future.result()
                    results[key] = success
                    print(f"Completed: {key} -> {'✅ Success' if success else '❌ Failed'}")

            # Final Summary
            success_count = sum(results.values())
            log("═" * 70, "")
            log(f"SUMMARY: {success_count}/{len(tasks)} Successful", "🏁")
            
            if success_count < len(tasks):
                sys.exit(1)

        execute_all()
        PYEOF
